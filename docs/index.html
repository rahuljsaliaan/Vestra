<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vestra — Codebase Docs</title>
    <meta
      name="description"
      content="A beginner-friendly guided tour of the Vestra codebase: architecture, design patterns and OOP explained with real-world examples."
    />

    <!-- Apply saved theme before paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('vestra-docs-theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..600&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <!-- Top navigation bar -->
    <header class="topbar">
      <button class="topbar__menu" id="menuToggle" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M3 6h18M3 12h18M3 18h18" />
        </svg>
      </button>
      <a class="topbar__brand" href="#/">
        <span class="topbar__logo">V</span>
        <span class="topbar__name">Vestra <em>Docs</em></span>
      </a>

      <div class="topbar__search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" />
        </svg>
        <input id="searchInput" type="search" placeholder="Search the docs…" autocomplete="off" aria-label="Search documentation" />
        <kbd>/</kbd>
        <div class="search-results" id="searchResults" role="listbox" hidden></div>
      </div>

      <div class="topbar__actions">
        <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme">
          <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
          </svg>
          <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </button>
      </div>
    </header>

    <div class="scrim" id="scrim" hidden></div>

    <!-- Left sidebar / index -->
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar__nav" id="sidebarNav" aria-label="Documentation index"></nav>
    </aside>

    <!-- Main content -->
    <main class="content" id="content" tabindex="-1">
      <article class="doc" id="doc"></article>
      <footer class="doc-footer" id="docFooter"></footer>
    </main>

    <!-- Right on-page table of contents -->
    <aside class="toc" id="toc" aria-label="On this page"></aside>

    <script type="module" src="assets/app.js"></script>
  </body>
</html>
